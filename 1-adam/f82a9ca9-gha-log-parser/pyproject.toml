[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gha-log-parser"
version = "1.0.0"
description = "CLI that turns GitHub Actions failed logs into structured JSON."
requires-python = ">=3.10"

[project.scripts]
gha-log-parser = "actions_log_parser.cli:main"

[tool.pylint.main]
py-version = "3.10"

[tool.pylint.messages_control]
disable = ["too-few-public-methods", "duplicate-code"]
